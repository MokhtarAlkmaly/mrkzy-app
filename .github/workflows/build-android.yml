name: بناء تطبيق أندرويد (APK) — نسخة بدون إنترنت

# يبني ملف APK جاهزًا للتثبيت، دون الحاجة لأي جهاز كمبيوتر أو Android Studio.
# هذه النسخة لا تحتاج أي أسرار (Secrets) ولا Supabase: قاعدة البيانات مجلد على الجهاز.
# طريقة الاستخدام: افتح تبويب Actions، شغّل هذا الـ workflow (أو ادفع تعديلاً إلى main)،
# ثم حمّل الملف الناتج mrkzy-net-offline.apk من قسم "Artifacts" أسفل صفحة التشغيل
# (يُرفع ملف APK مباشرة — بدون ملف zip — فيُثبَّت فور تنزيله على الجوال).

on:
  workflow_dispatch:
  push:
    branches: [main, "arena/**"]
    paths-ignore:
      - "**.md"

jobs:
  build:
    # إصدار ثابت بدل ubuntu-latest (الذي ينتقل إلى Ubuntu 26 ابتداءً من 19 أكتوبر 2026)
    # حتى لا يتغير محيط البناء فجأة.
    runs-on: ubuntu-24.04
    steps:
      - name: سحب المشروع
        uses: actions/checkout@v7

      - name: تثبيت Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: تثبيت Java (مطلوب لبناء أندرويد)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: تثبيت حزم المشروع
        run: npm install

      - name: فحص الأنواع (TypeScript)
        run: npm run typecheck

      - name: اختبارات قاعدة البيانات المحلية
        run: npm run test:db

      - name: بناء ملفات الويب
        run: npm run build
        env:
          CAPACITOR_BUILD: "1"

      - name: توليد index.html ثابت من الخادم (لتطبيق أندرويد فقط)
        run: |
          PORT=3000 node .output/server/index.mjs &
          SERVER_PID=$!
          for i in $(seq 1 20); do
            if curl -sf http://localhost:3000/ -o .output/public/index.html; then
              break
            fi
            sleep 0.5
          done
          kill $SERVER_PID
          test -s .output/public/index.html

      - name: ربط الإضافات الأصلية (Capacitor sync)
        run: npx cap sync android

      - name: صلاحية تنفيذ gradlew
        run: chmod +x android/gradlew

      - name: بناء APK (نسخة تجريبية debug)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: فحص ملف APK (اسم الحزمة، التوقيع، إضافة المجلد)
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          PKG=$("$BT"/aapt2 dump packagename "$APK")
          CERT=$("$BT"/apksigner verify --print-certs "$APK" | grep -m1 "certificate DN" || true)
          FOUND=0
          for DEX in $(unzip -Z1 "$APK" 'classes*.dex'); do
            if unzip -p "$APK" "$DEX" | grep -aq "Lorg/inmaa/mrkzynet/FolderDbPlugin;"; then FOUND=1; fi
          done
          SIZE=$(du -h "$APK" | cut -f1)
          echo "::notice title=APK::package=$PKG | size=$SIZE | FolderDbPlugin=$FOUND | $CERT"
          test "$PKG" = "org.inmaa.mrkzynet"
          test "$FOUND" = "1"
          echo "$CERT" | grep -q "Mrkzy-net Debug"

      - name: تسمية الملف
        run: cp android/app/build/outputs/apk/debug/app-debug.apk mrkzy-net-offline.apk

      - name: رفع ملف APK كمرفق للتحميل
        uses: actions/upload-artifact@v7
        with:
          path: mrkzy-net-offline.apk
          # بدون ضغط: يظهر المرفق باسم mrkzy-net-offline.apk ويُنزَّل كملف APK مباشرة.
          archive: false
